<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF7F0">
<title>המוזיאון הפיזיטלי 360</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700;900&family=Heebo:wght@300;400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<style>
:root{
  --ivory:#FAF7F0;--trav:#F1EADC;--gold:#B88C46;--gold2:#E2C285;--bord:#4A1C24;--royal:#1F3A6B;
  --walnut:#3B2416;--ink:#2A1D14;--muted:#7A6A58;--line:#DDCDB0;
  --serif:"Frank Ruhl Libre",Georgia,serif;--sans:"Heebo","Assistant",system-ui,sans-serif;
  --shadow:0 18px 50px rgba(60,40,20,.20);--safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--ivory);color:var(--ink);font-family:var(--sans);overflow:hidden}
#stage{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none;cursor:grab}
#stage:active{cursor:grabbing}
button{font-family:inherit;cursor:pointer;color:inherit}
[hidden]{display:none!important}

/* ── loader ── */
#loader{position:fixed;inset:0;z-index:90;display:grid;place-items:center;text-align:center;
  background:radial-gradient(120% 90% at 50% 40%,#FFFDF8 0%,#F5EDDE 55%,#E8DAC0 100%);transition:opacity .9s ease}
#loader.gone{opacity:0;pointer-events:none}
.crest{font-family:var(--serif);font-size:54px;color:var(--gold);line-height:1}
.l-title{font-family:var(--serif);font-weight:700;font-size:clamp(28px,5.5vw,46px);color:var(--bord);margin:12px 0 4px}
.l-sub{letter-spacing:3px;color:var(--muted);font-size:13px}
.l-bar{width:180px;height:2px;margin:26px auto 0;background:rgba(184,140,70,.2);overflow:hidden;border-radius:2px}
.l-bar i{display:block;height:100%;width:40%;background:linear-gradient(90deg,transparent,var(--gold),transparent);animation:lb 1.4s ease-in-out infinite}
@keyframes lb{0%{transform:translateX(160%)}100%{transform:translateX(-260%)}}

/* ── silk transition ── */
#silk{position:fixed;inset:0;z-index:45;pointer-events:none;opacity:0;transition:opacity .6s ease;display:grid;place-items:center;
  background:radial-gradient(120% 90% at 50% 45%,#FFFDF8 0%,#F6EEDF 48%,#E6D7BC 100%)}
#silk::before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);
  background-size:250% 100%;animation:sheen 2.4s ease-in-out infinite;opacity:.6}
@keyframes sheen{0%{background-position:120% 0}100%{background-position:-120% 0}}
#silk.on{opacity:1;pointer-events:auto}
.s-in{position:relative;text-align:center;padding:0 24px;transform:translateY(10px);opacity:0;transition:all .7s ease .12s}
#silk.on .s-in{transform:none;opacity:1}
.s-kick{letter-spacing:4px;font-size:12px;color:var(--gold)}
.s-orn{width:min(220px,50vw);height:1px;margin:16px auto;background:linear-gradient(90deg,transparent,var(--gold),transparent);position:relative}
.s-orn::after{content:"❦";position:absolute;inset-inline-start:50%;top:-11px;transform:translateX(50%);background:#F8F1E4;padding:0 10px;color:var(--gold);font-size:16px}
.s-title{font-family:var(--serif);font-weight:700;font-size:clamp(30px,6.4vw,60px);color:var(--bord);line-height:1.15}
.s-sub{font-size:15px;color:var(--muted);letter-spacing:1px;margin-top:6px}

/* ── HUD ── */
.hud{position:fixed;top:calc(var(--safe-t) + 12px);inset-inline:12px;display:flex;align-items:center;gap:10px;pointer-events:none;z-index:20}
.hud>*{pointer-events:auto}
.hud .sp{flex:1;pointer-events:none}
.orb{width:46px;height:46px;border-radius:50%;border:1px solid rgba(184,140,70,.65);background:rgba(250,247,240,.84);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:var(--walnut);font-size:20px;display:grid;place-items:center;
  box-shadow:0 4px 18px rgba(60,40,20,.16),inset 0 0 0 3px rgba(255,255,255,.55);transition:transform .2s,background .2s}
.orb:hover{transform:translateY(-1px);background:#fff}
.tag{padding:8px 16px;border-radius:999px;background:rgba(250,247,240,.8);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  border:1px solid rgba(184,140,70,.45);font-family:var(--serif);font-size:15px;color:var(--walnut);max-width:52vw;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;box-shadow:0 4px 18px rgba(60,40,20,.12)}

/* ── exhibit hud ── */
.ex-hud{position:fixed;bottom:calc(var(--safe-b) + 14px);left:50%;transform:translateX(-50%);z-index:20;display:flex;gap:6px;align-items:center;
  padding:6px;border-radius:999px;background:rgba(250,247,240,.86);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  border:1px solid rgba(184,140,70,.5);box-shadow:0 8px 28px rgba(60,40,20,.2);max-width:calc(100vw - 20px)}
.ex-hud button{border:0;background:transparent;padding:9px 13px;border-radius:999px;font-size:14px;white-space:nowrap;color:var(--walnut)}
.ex-hud button:hover{background:#fff}
.ex-hud .z{font-size:19px;width:38px;padding:6px 0;font-weight:500}
.ex-hud .div{width:1px;height:22px;background:rgba(184,140,70,.45)}
@media (max-width:520px){.ex-hud .lbl{display:none}.ex-hud button{padding:9px 11px;font-size:16px}}

/* ── welcome caption ── */
#welcome{position:fixed;left:50%;bottom:calc(var(--safe-b) + 28px);transform:translate(-50%,12px);z-index:15;opacity:0;pointer-events:none;
  transition:all .9s ease;max-width:min(640px,88vw);text-align:center;padding:16px 26px;border-radius:14px;
  background:linear-gradient(180deg,rgba(255,253,248,.92),rgba(246,238,223,.9));border:1px solid rgba(184,140,70,.5);box-shadow:var(--shadow)}
#welcome.on{opacity:1;transform:translate(-50%,0)}
#welcome .w-t{font-family:var(--serif);font-size:clamp(16px,2.4vw,20px);line-height:1.6;color:var(--walnut);white-space:pre-line}
#welcome .w-o{color:var(--gold);font-size:13px;letter-spacing:3px;margin-bottom:6px}

/* ── drawer ── */
#scrim{position:fixed;inset:0;z-index:24;background:rgba(40,25,12,.28);opacity:0;pointer-events:none;transition:opacity .35s}
#scrim.on{opacity:1;pointer-events:auto}
#drawer{position:fixed;top:0;bottom:0;inset-inline-start:0;z-index:25;width:min(360px,88vw);transform:translateX(105%);transition:transform .45s cubic-bezier(.2,.8,.2,1);
  background:var(--ivory);box-shadow:-10px 0 40px rgba(60,40,20,.2);display:flex;flex-direction:column;padding-top:var(--safe-t)}
#drawer.on{transform:none}
#drawer::before{content:"";position:absolute;inset:10px;border:1px solid rgba(184,140,70,.35);border-radius:6px;pointer-events:none}
.dr-head{padding:26px 26px 14px;text-align:center;position:relative}
.dr-head .crest{font-size:30px}
.dr-title{font-family:var(--serif);font-weight:700;font-size:22px;color:var(--bord);margin-top:6px}
.dr-x{position:absolute;top:18px;inset-inline-end:18px;border:0;background:none;font-size:18px;color:var(--muted)}
.dr-body{flex:1;overflow-y:auto;padding:0 22px 28px;-webkit-overflow-scrolling:touch}
.dr-sec{font-size:12px;letter-spacing:3px;color:var(--gold);margin:18px 4px 8px}
.dr-z{display:flex;align-items:center;gap:10px;width:100%;text-align:start;border:0;background:none;padding:11px 10px;border-radius:10px;font-size:16px}
.dr-z:hover,.dr-z.cur{background:#fff}
.dr-z .dot{width:10px;height:10px;border-radius:50%;border:1px solid rgba(0,0,0,.15);flex:none}
.dr-z .nm{flex:1;font-family:var(--serif);font-size:17px}
.dr-z .ct{font-size:12px;color:var(--muted)}
.dr-btn{display:flex;align-items:center;gap:12px;width:100%;margin:6px 0;padding:13px 14px;border-radius:12px;border:1px solid rgba(184,140,70,.45);
  background:linear-gradient(180deg,#fff,#FBF6EC);font-size:15.5px;text-align:start}
.dr-btn:hover{border-color:var(--gold)}
.dr-btn .ic{width:30px;text-align:center;font-size:18px}
.dr-foot{font-size:11.5px;color:var(--muted);text-align:center;padding:10px 0 4px}

/* ── panel (hotspot / exhibit card) ── */
#panel{position:fixed;z-index:30;top:calc(var(--safe-t) + 74px);inset-inline-end:16px;width:min(400px,92vw);max-height:calc(100% - var(--safe-t) - 160px);
  overflow-y:auto;-webkit-overflow-scrolling:touch;background:linear-gradient(180deg,#FFFDF8,#F7F0E2);border:1px solid rgba(184,140,70,.55);border-radius:18px;
  box-shadow:var(--shadow);padding:26px 24px 20px;opacity:0;transform:translateY(10px) scale(.98);pointer-events:none;transition:all .4s cubic-bezier(.2,.8,.2,1)}
#panel.open{opacity:1;transform:none;pointer-events:auto}
#panel::before{content:"";position:absolute;inset:7px;border:1px solid rgba(184,140,70,.25);border-radius:13px;pointer-events:none}
@media (max-width:700px){#panel{inset-inline:0;top:auto;bottom:0;width:100%;max-height:64vh;border-radius:20px 20px 0 0;padding-bottom:calc(20px + var(--safe-b));transform:translateY(30px)}}
.p-x{position:absolute;top:12px;inset-inline-end:12px;width:34px;height:34px;border-radius:50%;border:1px solid rgba(184,140,70,.4);background:#fff;font-size:14px}
.p-kick{font-size:12px;letter-spacing:3px;color:var(--gold)}
.p-title{font-family:var(--serif);font-weight:700;font-size:26px;color:var(--bord);margin:6px 0 4px;line-height:1.25}
.p-by{color:var(--muted);font-size:15px}
.p-chip{display:inline-block;margin-top:10px;padding:4px 12px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:13px}
.p-text{font-size:16.5px;line-height:1.75;margin:14px 0 6px;white-space:pre-line}
.p-meta{font-size:13px;color:var(--bord);margin-top:8px}
.p-sec{font-size:12px;letter-spacing:3px;color:var(--gold);margin:18px 0 8px}
.p-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.p-nav{display:flex;justify-content:space-between;margin-top:18px;gap:8px}
.p-audio audio{width:100%;margin-top:12px}
.p-load{font-size:13px;color:var(--muted);margin-top:12px}
.stickers{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sticker{border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;transition:all .25s}
.sticker .em{font-size:28px;transition:transform .3s}
.sticker b{font-size:13px;color:var(--bord)}
.sticker:hover .em{transform:scale(1.15) rotate(-6deg)}
.sticker.on{border-color:var(--gold);background:#FFF8E8;box-shadow:inset 0 0 0 2px rgba(226,194,133,.6)}

/* ── buttons & fields ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid rgba(184,140,70,.6);background:#fff;padding:10px 16px;border-radius:11px;
  font-size:14.5px;font-weight:500;color:var(--walnut);text-decoration:none;transition:all .2s;white-space:nowrap}
.btn:hover{border-color:var(--gold);box-shadow:0 3px 12px rgba(184,140,70,.25)}
.btn.gold{background:linear-gradient(180deg,#EBD093,#C49A52);border-color:#A17A38;color:#2A170C}
.btn.bord{background:var(--bord);border-color:var(--bord);color:#fff}
.btn.ghost{background:transparent}
.btn.danger{color:#8B1D1D;border-color:rgba(139,29,29,.35)}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.45;pointer-events:none}
.btn.on{background:#FFF3D6}
.fld{display:block;margin:12px 0}
.fld>span{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}
.fld input,.fld select,.fld textarea,.inp{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#FFFDF9;font:inherit;font-size:16px;color:var(--ink)}
.fld textarea{min-height:86px;resize:vertical;line-height:1.6}
.fld input:focus,.fld select:focus,.fld textarea:focus,.inp:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(226,194,133,.35)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media (max-width:560px){.grid2{grid-template-columns:1fr}}

/* ── modal ── */
#modal{position:fixed;inset:0;z-index:70;display:none}
#modal.open{display:block}
.m-back{position:absolute;inset:0;background:rgba(40,25,12,.42);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.m-card{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,94vw);max-height:90vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  background:linear-gradient(180deg,#FFFDF8,#F7F0E2);border:1px solid rgba(184,140,70,.6);border-radius:20px;box-shadow:var(--shadow);padding:28px 26px 22px;animation:pop .35s ease}
.m-card.wide{width:min(760px,96vw)}
@keyframes pop{from{opacity:0;transform:translate(-50%,-46%)}}
.m-x{position:absolute;top:14px;inset-inline-end:14px;width:34px;height:34px;border-radius:50%;border:1px solid rgba(184,140,70,.4);background:#fff}
.m-h{font-family:var(--serif);font-weight:700;font-size:26px;color:var(--bord);margin:0 0 4px}
.m-sub{color:var(--muted);font-size:14px;margin-bottom:6px}
.m-foot{display:flex;gap:8px;justify-content:flex-start;margin-top:18px;flex-wrap:wrap}
.drop{border:1.5px dashed rgba(184,140,70,.7);border-radius:14px;padding:16px;text-align:center;background:#fff;cursor:pointer;position:relative}
.drop img{max-width:100%;max-height:220px;border-radius:8px;display:block;margin:0 auto}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer}
.qrbox{text-align:center}
.qrbox img{width:min(300px,70vw);image-rendering:pixelated;border:10px solid #fff;border-radius:10px;box-shadow:0 6px 24px rgba(60,40,20,.15)}
.qrbox .u{direction:ltr;font-size:12px;color:var(--muted);word-break:break-all;margin-top:10px}

/* ── toasts ── */
#toasts{position:fixed;left:50%;bottom:calc(var(--safe-b) + 84px);transform:translateX(-50%);z-index:95;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{padding:12px 20px;border-radius:12px;background:#2E1F14;color:#FBF4E6;font-size:14.5px;box-shadow:0 10px 30px rgba(0,0,0,.25);opacity:0;transform:translateY(8px);
  transition:all .35s;max-width:90vw;text-align:center;border:1px solid rgba(226,194,133,.4)}
.toast.in{opacity:1;transform:none}
.toast.ok{background:#2D3B27}.toast.err{background:#5A1A20}

/* ── admin ── */
#admin{position:fixed;inset:0;z-index:50;display:none;overflow-y:auto;-webkit-overflow-scrolling:touch;
  background:radial-gradient(1200px 600px at 80% -10%,#FFFDF8,transparent),var(--ivory)}
#admin.open{display:block}
.ad-wrap{max-width:1180px;margin:0 auto;padding:calc(var(--safe-t) + 18px) 18px 60px}
.ad-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:1px solid rgba(184,140,70,.35);padding-bottom:14px}
.ad-top h1{font-family:var(--serif);font-weight:900;font-size:clamp(26px,4vw,36px);color:var(--bord);margin:0}
.ad-kick{font-size:12px;letter-spacing:3px;color:var(--gold)}
.ad-who{margin-inline-start:auto;font-size:14px;color:var(--muted);padding:6px 12px;border-radius:999px;background:#fff;border:1px solid var(--line)}
.ad-ver{margin-top:12px;padding:12px 16px;border-radius:12px;background:#FFF1E0;border:1px solid #E7B77A;color:#6B3A0E;font-size:14px}
.ad-metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}
@media (max-width:700px){.ad-metrics{grid-template-columns:repeat(2,1fr)}}
.mt{background:linear-gradient(180deg,#fff,#FBF6EC);border:1px solid var(--line);border-radius:16px;padding:14px 16px;position:relative;overflow:hidden}
.mt b{display:block;font-family:var(--serif);font-size:34px;color:var(--bord);line-height:1.1}
.mt span{font-size:13px;color:var(--muted)}
.mt.hot{border-color:var(--gold);box-shadow:inset 0 0 0 2px rgba(226,194,133,.45)}
.ad-tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid rgba(184,140,70,.35);margin-bottom:18px}
.ad-tab{border:0;background:none;padding:12px 16px;font-size:15px;border-bottom:3px solid transparent;margin-bottom:-1px;color:var(--muted)}
.ad-tab.on{color:var(--bord);border-color:var(--gold);font-weight:700}
.ad-tab .n{display:inline-block;min-width:20px;padding:0 6px;border-radius:999px;background:var(--bord);color:#fff;font-size:12px;margin-inline-start:6px}
.ad-h{font-family:var(--serif);font-size:21px;color:var(--bord);margin:22px 0 10px;font-weight:700}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.ac{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.thumb{aspect-ratio:4/3;background:linear-gradient(135deg,#F3EBDB,#E6D8BF);display:grid;place-items:center;color:var(--muted);font-size:13px;position:relative;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;animation:fade .5s}
.thumb.wide{aspect-ratio:2/1}
@keyframes fade{from{opacity:0}}
.ac .bd{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.ac h4{margin:0;font-family:var(--serif);font-size:19px;color:var(--bord)}
.ac .by{font-size:13.5px;color:var(--muted)}
.ac p{margin:2px 0;font-size:14px;line-height:1.55;color:#4b3b2c;max-height:4.7em;overflow:hidden}
.ac .row{margin-top:auto;padding-top:8px}
.lst{display:flex;flex-direction:column;gap:10px}
.li{display:flex;gap:14px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;flex-wrap:wrap}
.li .thumb{width:110px;flex:none;border-radius:10px}
.li .mid{flex:1;min-width:180px}
.li .mid b{font-family:var(--serif);font-size:18px;color:var(--bord)}
.li .mid div{font-size:13px;color:var(--muted)}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;border:1px solid var(--line);background:#FBF6EC}
.pill.warn{background:#FFF1E0;border-color:#E7B77A;color:#6B3A0E}
.box{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px}
.box.feature{border-color:var(--gold);box-shadow:inset 0 0 0 3px rgba(226,194,133,.25)}
.lobby-grid{display:grid;grid-template-columns:minmax(220px,340px) 1fr;gap:18px}
@media (max-width:760px){.lobby-grid{grid-template-columns:1fr}}
.empty{padding:28px;text-align:center;color:var(--muted);background:#fff;border:1px dashed var(--line);border-radius:14px}
table.st{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden;border:1px solid var(--line)}
table.st th,table.st td{padding:10px 12px;text-align:start;border-bottom:1px solid #EFE6D4;font-size:14.5px}
table.st th{background:#FBF6EC;font-weight:500;color:var(--muted)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--line);cursor:pointer}
.sw.on{box-shadow:0 0 0 2px var(--gold)}
#admin.working::after{content:"";position:fixed;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,var(--gold),transparent);animation:lb 1.1s linear infinite}

/* ── studio ── */
#studio{position:fixed;inset:0;z-index:60;display:none;background:var(--ivory);flex-direction:column}
#studio.open{display:flex}
.st-top{display:flex;align-items:center;gap:12px;padding:calc(var(--safe-t) + 12px) 18px 12px;border-bottom:1px solid rgba(184,140,70,.35)}
.st-top h2{margin:0;font-family:var(--serif);color:var(--bord);font-size:22px}
.st-top .s{color:var(--muted);font-size:14px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st-main{flex:1;display:grid;grid-template-columns:400px 1fr;min-height:0}
@media (max-width:900px){.st-main{grid-template-columns:1fr;overflow-y:auto;-webkit-overflow-scrolling:touch}.st-canvas{min-height:52vh}}
.st-canvas{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;background:#EFE6D4;min-height:0;order:2}
.st-side{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px;border-inline-start:1px solid rgba(184,140,70,.3);order:1}
@media (max-width:900px){.st-side{overflow:visible;order:2}.st-canvas{order:1}}
.st-wrap{position:relative;display:inline-block;max-width:100%;line-height:0;box-shadow:0 10px 40px rgba(60,40,20,.25);border:8px solid #fff}

  color:#fff;background:radial-gradient(circle at 35% 30%,#7A2E39,#4A1C24);border:3px solid #E2C285;box-shadow:0 3px 12px rgba(0,0,0,.4);cursor:grab;touch-action:none;line-height:1}
.pin.sel{transform:scale(1.18);border-color:#fff}
.st-hint{margin-top:12px;font-size:13px;color:var(--muted);line-height:1.4;text-align:center}
.pt{border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px;margin-bottom:10px}
.pt.sel{border-color:var(--gold);box-shadow:inset 0 0 0 2px rgba(226,194,133,.5)}
.pt-h{display:flex;gap:8px;align-items:center}
.pt-h .num{width:30px;height:30px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--bord);color:#fff;font-family:var(--serif);font-weight:700}
.pt .inp{margin-top:8px;font-size:15px;padding:9px 11px}

@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(139,29,29,.18)}}

<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ═════════════ הגדרות ═════════════ */
const API_URL = 'https://script.google.com/macros/s/AKfycbyYbvMZRbDzoW6gu00cF-rlUbiCsxcuKO2keOHXS86Vl0STIViAXEjBU-D9jNAjRjwR/exec';
const CLIENT_API_VERSION = '3.0.0';
const EYE = 1.6;
const BASE_URL = location.origin + location.pathname;
const SERIF = '"Frank Ruhl Libre", Georgia, serif';
const SANS = 'Heebo, Assistant, sans-serif';
const DEFAULT_NAME = 'המוזיאון הפיזיטלי 360';
const THEMES = [['#4A1C24', 'בורדו קלאסי'], ['#1F3A6B', 'כחול רויאל'], ['#2F4A3A', 'ירוק אמרלד'], ['#5A3A22', 'עץ אגוז'], ['#8A6A2E', 'זהב עתיק'], ['#5B3A5E', 'סגול חציל']];
const REACTIONS = [['learned', '💡', 'למדתי חדש'], ['creative', '🎨', 'יצירתיות שיא'], ['bravo', '👏', 'כל הכבוד']];
const RANK = { submitter: 0, student_manager: 1, teacher: 2, super: 3 };
const ROLE_LABEL = { super: 'מנהל/ת כללי/ת', teacher: 'מורה אחראי/ת', student_manager: 'אוצר/ת צעיר/ה', submitter: 'תלמיד/ה מגיש/ה' };

/* ═════════════ עזרים ═════════════ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const wait = ms => new Promise(r => setTimeout(r, ms));
const ease = t => (t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const sid = v => String(v ?? '').trim();
let seed = 20250;
const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const classLabel = c => { c = sid(c); return !c ? '' : (/כית/.test(c) ? c : 'כיתה ' + c); };
const safeUrl = u => { u = sid(u); if (!u) return ''; if (!/^https?:\/\//i.test(u)) u = 'https://' + u; return u; };
const nearAngle = (cur, a) => a + Math.round((cur - a) / (Math.PI * 2)) * Math.PI * 2;

function toast(msg, kind = '', ms = 3400) {
  const el = document.createElement('div');
  el.className = 'toast ' + kind; el.textContent = msg;
  $('#toasts').appendChild(el);
  requestAnimationFrame(() => el.classList.add('in'));
  setTimeout(() => { el.classList.remove('in'); setTimeout(() => el.remove(), 400); }, ms);
}

function loadImg(src) {
  return new Promise((res, rej) => { const i = new Image(); i.decoding = 'async'; i.onload = () => res(i); i.onerror = () => rej(new Error('img')); i.src = src; });
}
const blobToDataUrl = b => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(b); });

/* ═════════════ API ═════════════ */
let serverVersion = null;
async function api(action, params = {}, method = 'POST') {
  const url = method === 'GET' ? API_URL + '?' + new URLSearchParams({ action, ...params }) : API_URL;
  const opts = method === 'GET' ? undefined : { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action, ...params }) };
  let res, j;
  try { res = await fetch(url, opts); } catch (e) { throw new Error('אין חיבור לשרת'); }
  try { j = await res.json(); } catch (e) { throw new Error('תשובה לא תקינה מהשרת — ודאו שהסקריפט פורסם כ-Web App עם גישה ל-Anyone'); }
  if (j && j.apiVersion) serverVersion = j.apiVersion;
  if (!j || j.ok === false) throw new Error((j && j.error) || 'שגיאת שרת');
  return j;
}
const authed = (action, params = {}) => api(action, { authCode: state.auth ? state.auth.code : '', ...params });

/* ═════════════ טעינת מדיה: תור מבוקר + מטמון ═════════════ */
const media = { mem: new Map(), pending: new Map(), queue: [], active: 0, LIMIT: 3 };
function driveId(ref) {
  ref = sid(ref);
  if (!ref) return '';
  if (/^[-\w]{20,}$/.test(ref)) return ref;
  const m = ref.match(/[?&]id=([-\w]{20,})/) || ref.match(/\/d\/([-\w]{20,})/) || ref.match(/([-\w]{25,})/);
  return m ? m[1] : '';
}
let cacheStore = null;
async function cacheOpen() { if (cacheStore !== null) return cacheStore; try { cacheStore = await caches.open('museum360-media-v1'); } catch (e) { cacheStore = false; } return cacheStore; }
async function cacheRead(k) { const c = await cacheOpen(); if (!c) return null; try { const r = await c.match('https://museum.cache/' + k); return r ? await r.text() : null; } catch (e) { return null; } }
async function cacheWrite(k, v) { const c = await cacheOpen(); if (!c) return; try { await c.put('https://museum.cache/' + k, new Response(v)); } catch (e) { } }

function loadMedia(ref, kind = 'image') {
  ref = sid(ref);
  if (!ref) return Promise.reject(new Error('אין קובץ'));
  if (ref.startsWith('data:')) return Promise.resolve(ref);
  const id = driveId(ref);
  if (!id) return Promise.reject(new Error('מזהה קובץ לא תקין'));
  const key = kind + ':' + id;
  if (media.mem.has(key)) return Promise.resolve(media.mem.get(key));
  if (media.pending.has(key)) return media.pending.get(key);
  const p = new Promise((resolve, reject) => { media.queue.push({ key, id, kind, resolve, reject }); pump(); });
  media.pending.set(key, p);
  return p;
}
function pump() {
  while (media.active < media.LIMIT && media.queue.length) {
    const job = media.queue.shift();
    media.active++;
    (async () => {
      try {
        let data = await cacheRead(job.key);
        if (!data) {
          let err;
          for (let a = 0; a < 2 && !data; a++) {
            try { data = (await api(job.kind === 'audio' ? 'get_audio_base64' : 'get_image_base64', { id: job.id }, 'GET')).dataUrl; }
            catch (e) { err = e; await wait(700); }
          }
          if (!data) throw err || new Error('טעינה נכשלה');
          cacheWrite(job.key, data);
        }
        media.mem.set(job.key, data);
        job.resolve(data);
      } catch (e) { job.reject(e); }
      finally { media.pending.delete(job.key); media.active--; pump(); }
    })();
  }
}
const blobUrls = new Map();
async function audioUrl(ref) {
  const data = await loadMedia(ref, 'audio');
  if (blobUrls.has(data.length + ':' + data.slice(-40))) return blobUrls.get(data.length + ':' + data.slice(-40));
  const b = await (await fetch(data)).blob();
  const u = URL.createObjectURL(b);
  blobUrls.set(data.length + ':' + data.slice(-40), u);
  return u;
}

/* ═════════════ מצב ═════════════ */
const state = {
  data: { zones: [], exhibits: [], settings: {} },
  place: 'lobby', zoneId: null, exhibitId: null, mode: null,
  auth: null, busy: false, dirty: false,
  admin: { tab: 'queue', filter: 'all', data: null }
};
const zoneById = id => state.data.zones.find(z => sid(z.id) === sid(id));
const exById = id => state.data.exhibits.find(x => sid(x.id) === sid(id));
const exInZone = id => state.data.exhibits.filter(x => sid(x.zoneId) === sid(id));
const museumName = () => sid(state.data.settings.museumName) || DEFAULT_NAME;
const norm = v => { v = Number(v) || 0; return v > 1 ? v / 100 : v; };
function parseHotspots(x) {
  let a = [];
  try { a = typeof x === 'string' ? JSON.parse(x || '[]') : (x || []); } catch (e) { a = []; }
  if (!Array.isArray(a)) a = [];
  return a.map((h, i) => ({
    id: h.id || ('h' + i + Date.now().toString(36)), x: clamp(norm(h.x), 0, 1), y: clamp(norm(h.y), 0, 1),
    title: h.title || '', text: h.text || h.description || '', link: h.link || h.url || '',
    audioFileId: h.audioFileId || '', audio: h.audio && String(h.audio).startsWith('data:') ? h.audio : ''
  }));
}
const parseReactions = s => { try { return JSON.parse(s || '{}') || {}; } catch (e) { return {}; } };
const zActive = z => { const s = sid(z.status); return !s || s === 'approved' || s === 'active'; };
const can = min => state.auth && RANK[state.auth.role] >= RANK[min];

/* ═════════════ מנוע תלת-ממד ═════════════ */
const canvas = $('#stage');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
const scene = new THREE.Scene();
scene.background = new THREE.Color('#EFE6D6');
scene.fog = new THREE.Fog('#EFE4D0', 32, 75);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
const camera = new THREE.PerspectiveCamera(70, 1, 0.05, 200);
const world = new THREE.Group();
scene.add(world);
scene.add(new THREE.HemisphereLight('#FFF6E6', '#B89A78', 1.0));
scene.add(new THREE.AmbientLight('#FFF1DC', 0.25));
const sun = new THREE.DirectionalLight('#FFE9C8', 1.25);
sun.position.set(4, 14, 6);
scene.add(sun);
const MAXANISO = renderer.capabilities.getMaxAnisotropy();
const MAXTEX = Math.min(4096, renderer.capabilities.maxTextureSize || 4096);

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);

let disposables = [], pickables = [], animators = [], viewToken = 0;
const tmat = m => { disposables.push(m); return m; };
function ctex(c, temp = true) {
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = MAXANISO;
  if (temp) disposables.push(t);
  return t;
}
function disposeGroup(g) { g.traverse(o => { if (o.geometry && !o.isSprite) o.geometry.dispose(); }); }
function clearWorld() {
  viewToken++;
  disposeGroup(world);
  disposables.forEach(d => { try { d.dispose(); } catch (e) { } });
  disposables = []; pickables = []; animators = []; hovered = null;
  world.clear();
}

/* ── טקסטורות פרוצדורליות ── */
function roundRect(g, x, y, w, h, r) {
  g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
function fitText(g, text, weight, family, size, maxW) {
  let s = size;
  do { g.font = `${weight} ${s}px ${family}`; if (g.measureText(text).width <= maxW) break; s -= 2; } while (s > 16);
  return s;
}
function clipText(g, text, maxW) {
  if (g.measureText(text).width <= maxW) return text;
  let t = text;
  while (t.length > 1 && g.measureText(t + '…').width > maxW) t = t.slice(0, -1);
  return t + '…';
}
function veins(g, S, n, rgb) {
  g.lineCap = 'round'; g.lineJoin = 'round';
  for (let v = 0; v < n; v++) {
    const pts = []; let x = rnd() * S, y = rnd() * S, a = rnd() * Math.PI * 2;
    for (let s = 0; s < 70; s++) { a += (rnd() - .5) * .6; x += Math.cos(a) * 12; y += Math.sin(a) * 12; pts.push([x, y]); }
    const w = .5 + rnd() * 2.2, al = .05 + rnd() * .15;
    for (const ox of [-S, 0, S]) for (const oy of [-S, 0, S]) {
      g.beginPath(); pts.forEach(([px, py], i) => (i ? g.lineTo(px + ox, py + oy) : g.moveTo(px + ox, py + oy)));
      g.strokeStyle = `rgba(${rgb},${al})`; g.lineWidth = w; g.stroke();
    }
  }
}
function clouds(g, S, n) {
  for (let k = 0; k < n; k++) {
    const x = rnd() * S, y = rnd() * S, r = 40 + rnd() * 170, a = rnd() * .06;
    const gr = g.createRadialGradient(x, y, 0, x, y, r);
    gr.addColorStop(0, rnd() < .5 ? `rgba(255,255,255,${a})` : `rgba(170,150,120,${a})`);
    gr.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = gr; g.fillRect(x - r, y - r, 2 * r, 2 * r);
  }
}
function marbleTiles() {
  const S = 1024, c = mk(S, S), g = c.getContext('2d'), t = S / 2;
  for (let i = 0; i < 2; i++) for (let j = 0; j < 2; j++) { g.fillStyle = (i + j) % 2 ? '#E8DAC1' : '#F7F1E6'; g.fillRect(i * t, j * t, t, t); }
  clouds(g, S, 120); veins(g, S, 18, '120,100,78');
  g.strokeStyle = 'rgba(150,120,80,.35)'; g.lineWidth = 3;
  for (let i = 0; i <= 2; i++) { g.beginPath(); g.moveTo(i * t, 0); g.lineTo(i * t, S); g.stroke(); g.beginPath(); g.moveTo(0, i * t); g.lineTo(S, i * t); g.stroke(); }
  return c;
}
function plainMarble() { const S = 512, c = mk(S, S), g = c.getContext('2d'); g.fillStyle = '#F3EBDD'; g.fillRect(0, 0, S, S); clouds(g, S, 60); veins(g, S, 8, '130,110,85'); return c; }
function walnut(w = 512, h = 512, base = '#4A2B19') {
  const c = mk(w, h), g = c.getContext('2d');
  g.fillStyle = base; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 260; i++) {
    const y = rnd() * h;
    g.strokeStyle = `rgba(${rnd() < .5 ? '20,10,5' : '125,80,48'},${.05 + rnd() * .18})`;
    g.lineWidth = .5 + rnd() * 2.5; g.beginPath(); g.moveTo(0, y);
    for (let x = 0; x <= w; x += 32) g.lineTo(x, y + Math.sin(x * .01 + i) * 4 + (rnd() - .5) * 2);
    g.stroke();
  }
  return c;
}
function doorPanel() {
  const W = 512, H = 2048, c = mk(W, H), g = c.getContext('2d');
  const wn = walnut(H, W, '#4E2D1A');
  g.save(); g.translate(W, 0); g.rotate(Math.PI / 2); g.drawImage(wn, 0, 0); g.restore();
  const panel = (x, y, w, h) => {
    g.fillStyle = 'rgba(0,0,0,.30)'; g.fillRect(x, y, w, h);
    g.fillStyle = 'rgba(255,220,170,.07)'; g.fillRect(x + 16, y + 16, w - 32, h - 32);
    g.strokeStyle = '#D9B66C'; g.lineWidth = 7; g.strokeRect(x + 26, y + 26, w - 52, h - 52);
    g.strokeStyle = 'rgba(0,0,0,.5)'; g.lineWidth = 5; g.strokeRect(x, y, w, h);
    g.strokeStyle = 'rgba(255,230,190,.22)'; g.lineWidth = 4; g.beginPath(); g.moveTo(x, y + h); g.lineTo(x + w, y + h); g.lineTo(x + w, y); g.stroke();
  };
  panel(70, H * .30, W - 140, H * .27);
  panel(70, H * .63, W - 140, H * .29);
  // rosette
  const rx = W / 2, ry = H * .435;
  for (let k = 0; k < 8; k++) { g.save(); g.translate(rx, ry); g.rotate(k * Math.PI / 4); g.fillStyle = '#D6B26A'; g.beginPath(); g.ellipse(0, -34, 12, 30, 0, 0, Math.PI * 2); g.fill(); g.restore(); }
  g.fillStyle = '#F1D894'; g.beginPath(); g.arc(rx, ry, 16, 0, Math.PI * 2); g.fill();
  // handle near inner edge (u≈0.88)

function curvedGeo(R, theta, H, segX = 96, yc = EYE) {
  const pos = [], uv = [], idx = [];
  for (let j = 0; j <= 1; j++) for (let i = 0; i <= segX; i++) {
    const u = i / segX, v = j, a = (u - .5) * theta;
    pos.push(R * Math.sin(a), yc + (.5 - v) * H, -R * Math.cos(a)); uv.push(u, 1 - v);
  }
  for (let i = 0; i < segX; i++) { const a = i, b = i + 1, c = i + segX + 1, d = c + 1; idx.push(a, c, b, b, c, d); }
  const g = new THREE.BufferGeometry();
  g.setIndex(idx); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.computeVertexNormals();

}

  const rim = tmat(M.gold.clone()); rim.side = THREE.DoubleSide;
  world.add(new THREE.Mesh(curvedGeo(R + .02, theta + .035, .12, 96, EYE + H / 2 + .06), rim));
  world.add(new THREE.Mesh(curvedGeo(R + .02, theta + .035, .12, 96, EYE - H / 2 - .06), rim));
  for (const s of [-1, 1]) { const a = s * (theta / 2 + .012), p = new THREE.Mesh(new THREE.BoxGeometry(.1, H + .24, .1), rim); p.position.set((R + .02) * Math.sin(a), EYE, -(R + .02) * Math.cos(a)); p.rotation.y = -a; world.add(p); }

    pos: (x, y) => { const a = (x - .5) * theta, r = R - .15; return new THREE.Vector3(r * Math.sin(a), EYE + (.5 - y) * H, -r * Math.cos(a)); },
    size: .42,

  return {
    pos: (x, y) => { const ph = phiS + x * phiL, th = thS + y * thL, r = R * .94; return new THREE.Vector3(r * Math.cos(ph) * Math.sin(th), EYE + r * Math.cos(th), r * Math.sin(ph) * Math.sin(th)); },
    size: 1.0,

async function cinematic({ yaw = null, pitch = null, door = null, dolly = 0, title = '', sub = '', kick = '', build }) {
  if (state.busy) return;
  state.busy = true;
  closePanel(); hideWelcome(); drawer(false);
  if (hovered && hovered.setHover) hovered.setHover(false);
  hovered = null; drag.active = false; ptrs.clear();
  try {
    if (yaw !== null) {
      view.vYaw = view.vPitch = 0;
      view.tYaw = nearAngle(view.yaw, yaw);
      if (pitch !== null) view.tPitch = pitch;
      const diff = Math.abs(view.tYaw - view.yaw) + Math.abs(view.tPitch - view.pitch);
      await wait(diff > .05 ? 480 : 120);
    }
    if (door) { door.open(1050); await wait(320); }
    const dir = dirOf(view.tYaw, view.tPitch);
    const f0 = view.tFov;
    let shown = false;
    if (dolly) {
      await tween(860, t => {
        const e = ease(t);
        camOffset.copy(dir).multiplyScalar(dolly * e);
        view.tFov = f0 - 6 * e;
        if (t > .46 && !shown) { shown = true; silk(true, title, sub, kick); }
      });
    }
    if (!shown) { silk(true, title, sub, kick); await wait(420); }
    const t0 = performance.now();
    await build();
    const el = performance.now() - t0;
    if (el < 380) await wait(380 - el);
    view.fov = Math.min(view.maxFov, view.tFov * 1.12);
    silk(false);
    updateUrl();
    await wait(250);
  } catch (err) {
    console.error(err); silk(false); toast('אירעה שגיאה בטעינת המרחב', 'err');

}

function pickFile(accept = 'image/*') {
  return new Promise(res => {
    const i = document.createElement('input');
    i.type = 'file'; i.accept = accept; i.style.display = 'none';
    document.body.appendChild(i);
    i.onchange = () => { res(i.files[0] || null); i.remove(); };
    i.addEventListener('cancel', () => { res(null); i.remove(); });
    i.click();
  });
}
async function compressImage(file, maxW, { pano = false, q = .8 } = {}) {
  const url = URL.createObjectURL(file);
  try {
    let img;
    try { img = await loadImg(url); } catch (e) { throw new Error('לא ניתן לקרוא את התמונה (נסו JPG או PNG)'); }
    const w = img.naturalWidth, h = img.naturalHeight;
    const s = pano ? Math.min(1, maxW / w) : Math.min(1, maxW / w, (maxW * 1.25) / h);
    const c = mk(Math.max(1, Math.round(w * s)), Math.max(1, Math.round(h * s)));
    const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);
    g.imageSmoothingQuality = 'high'; g.drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', q);
  } finally { URL.revokeObjectURL(url); }
}

async function closeStudio() {

function renderPins() {
  const box = $('#stPins'); if (!box) return;

    pin.addEventListener('pointerdown', e => {

      selectPt(i);

        pin.style.left = p.x * 100 + '%'; pin.style.top = p.y * 100 + '%'; studio.dirty = true;
      };
      const up = () => { pin.removeEventListener('pointermove', move); pin.removeEventListener('pointerup', up); pin.removeEventListener('pointercancel', up); };

async function toggleRec(p, btn, card) {
  if (studio.rec) { studio.rec.stop(); return; }
  if (!navigator.mediaDevices || !window.MediaRecorder) { toast('הדפדפן אינו תומך בהקלטה', 'err'); return; }
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } }); }
  catch (e) { toast('אין גישה למיקרופון — יש לאשר הרשאה בדפדפן', 'err'); return; }
  const mr = new MediaRecorder(stream), chunks = [], t0 = Date.now(), tEl = card.querySelector('.t'), LIMIT = 45;
  mr.ondataavailable = ev => { if (ev.data && ev.data.size) chunks.push(ev.data); };
  const iv = setInterval(() => {
    const s = (Date.now() - t0) / 1000;
    tEl.textContent = `● ${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')} / 0:${LIMIT}`;
    if (s >= LIMIT && mr.state !== 'inactive') mr.stop();
  }, 200);
  studio.rec = { stop: () => { if (mr.state !== 'inactive') mr.stop(); } };
  btn.textContent = '⏹ עצירת ההקלטה'; btn.classList.add('live'); updateSave();
  mr.onstop = async () => {
    clearInterval(iv); stream.getTracks().forEach(t => t.stop());
    studio.rec = null; btn.classList.remove('live'); btn.textContent = '🎙️ הקלטה מחדש';
    studio.uploading++; updateSave();
    try {
      tEl.textContent = 'מעבד את ההקלטה…';
      const wav = await blobToWav(new Blob(chunks, { type: mr.mimeType || 'audio/webm' }));
      const dataUrl = await blobToDataUrl(wav);
      card.querySelector('.pv').innerHTML = `<audio controls playsinline src="${URL.createObjectURL(wav)}"></audio>`;
      tEl.textContent = '⬆ מעלה ל-Drive…';
      const r = await authed('upload_audio', { audio: dataUrl });
      p.audioFileId = r.fileId; p.audio = ''; studio.dirty = true;
      media.mem.set('audio:' + r.fileId, dataUrl);
      tEl.innerHTML = '<span class="ok">✓ ההקלטה הועלתה ל-Drive בהצלחה</span>';
    } catch (err) { tEl.textContent = '⚠ ' + err.message; }
    finally { studio.uploading = Math.max(0, studio.uploading - 1); updateSave(); }
  };
  mr.start(250);
}
async function blobToWav(blob, rate = 11025) {
  const AC = window.AudioContext || window.webkitAudioContext, ac = new AC();
  const arr = await blob.arrayBuffer();
  const buf = await new Promise((res, rej) => { const p = ac.decodeAudioData(arr, res, rej); if (p && p.then) p.then(res, rej); });
  try { ac.close(); } catch (e) { }
  const chs = buf.numberOfChannels, n = buf.length, mono = new Float32Array(n);
  for (let c = 0; c < chs; c++) { const d = buf.getChannelData(c); for (let i = 0; i < n; i++) mono[i] += d[i] / chs; }
  const ratio = buf.sampleRate / rate, outN = Math.max(1, Math.floor(n / ratio)), out = new Float32Array(outN);
  for (let i = 0; i < outN; i++) {
    const s = Math.floor(i * ratio), e = Math.min(n, Math.floor((i + 1) * ratio));
    let sum = 0; for (let k = s; k < e; k++) sum += mono[k];
    out[i] = e > s ? sum / (e - s) : (mono[s] || 0);
  }
  let peak = 0; for (let i = 0; i < outN; i++) peak = Math.max(peak, Math.abs(out[i]));
  const gain = peak > .01 ? Math.min(.95 / peak, 6) : 1;
  const dv = new DataView(new ArrayBuffer(44 + outN * 2));
  const w = (o, s) => { for (let i = 0; i < s.length; i++) dv.setUint8(o + i, s.charCodeAt(i)); };
  w(0, 'RIFF'); dv.setUint32(4, 36 + outN * 2, true); w(8, 'WAVE'); w(12, 'fmt ');
  dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, 1, true); dv.setUint32(24, rate, true);
  dv.setUint32(28, rate * 2, true); dv.setUint16(32, 2, true); dv.setUint16(34, 16, true); w(36, 'data'); dv.setUint32(40, outN * 2, true);
  for (let i = 0; i < outN; i++) { const v = clamp(out[i] * gain, -1, 1); dv.setInt16(44 + i * 2, v < 0 ? v * 0x8000 : v * 0x7FFF, true); }
  return new Blob([dv.buffer], { type: 'audio/wav' });
}
async function saveStudio() {
  if (studio.uploading || studio.rec) return;
  const clean = studio.points.map(p => {
    const o = { id: p.id, x: +p.x.toFixed(4), y: +p.y.toFixed(4), title: sid(p.title), text: sid(p.text), link: sid(p.link), audioFileId: p.audioFileId || '' };
    if (!o.audioFileId && p.audio) o.audio = p.audio;
    return o;
  });
  let json = JSON.stringify(clean);
  if (json.length > 45000) { clean.forEach(o => delete o.audio); json = JSON.stringify(clean); toast('הקלטות ישנות שנשמרו בפורמט הקודם הוסרו — אפשר להקליט אותן מחדש', '', 5000); }
  const b = $('#stSave'); b.disabled = true; b.textContent = 'שומר…';
  try {
    await authed('update_exhibit', { id: studio.ex.id, hotspotsJson: json });
    toast('הנקודות החמות נשמרו ✨', 'ok');
    studio.dirty = false; state.dirty = true;
    $('#studio').classList.remove('open'); $('#studio').innerHTML = '';
    await reloadAdmin(); refreshPublic();
  } catch (e) { toast(e.message, 'err', 5000); updateSave(); }
}

/* ═════════════ אתחול ═════════════ */
async function boot() {
  resize();
  initMaterials();
  buildDust();
  requestAnimationFrame(frame);
  const heb = 'אבגדהוזחטיכלמנסעפצקרשת';
  const fontsP = Promise.all([
    document.fonts.load(`700 80px "Frank Ruhl Libre"`, heb), document.fonts.load(`400 40px "Frank Ruhl Libre"`, heb),
    document.fonts.load(`500 40px Heebo`, heb), document.fonts.load(`400 40px Heebo`, heb)
  ]).catch(() => { });
  const dataP = api('get_public', {}, 'GET').then(j => {
    state.data = { zones: j.zones || [], exhibits: j.exhibits || [], settings: j.settings || {} };
  }).catch(e => toast('לא ניתן לטעון את נתוני המוזיאון: ' + e.message, 'err', 6000));
  await Promise.race([Promise.all([fontsP, dataP]), wait(15000)]);
  try { const a = JSON.parse(sessionStorage.getItem('m360auth') || 'null'); if (a && a.code) state.auth = a; } catch (e) { }
  $('#lTitle').textContent = museumName();
  document.title = museumName();
  const q = new URLSearchParams(location.search);
  try {
    if (q.get('exhibit') && exById(q.get('exhibit'))) await buildExhibit(q.get('exhibit'));
    else if (q.get('zone') && zoneById(q.get('zone'))) await buildRoom(q.get('zone'));
    else await buildLobby();
  } catch (e) { console.error(e); await buildLobby(); }
  updateUrl();
  view.fov = view.tFov + 14;
  $('#loader').classList.add('gone');
  setTimeout(() => $('#loader').remove(), 1000);
  setInterval(() => { if (!state.busy && !$('#admin').classList.contains('open')) refreshPublic(); }, 180000);
}
boot();
